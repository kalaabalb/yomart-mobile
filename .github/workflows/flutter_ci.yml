name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No previous commit is available; skipping changed-file format comparison."
            exit 0
          fi
          mapfile -t dart_files < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.dart')
          if (( ${#dart_files[@]} == 0 )); then
            echo "No Dart files changed."
          else
            dart format --output=none --set-exit-if-changed "${dart_files[@]}"
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android debug APK
        run: flutter build apk --debug --dart-define=YOMART_PREVIEW_CATALOG=true

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yomart-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Capture real Android emulator startup screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell monkey -p com.yomobiles.client 1
            sleep 15
            mkdir -p artifacts/android
            adb exec-out screencap -p > artifacts/android/android-app-startup.png

      - name: Upload genuine Android emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: yomart-android-emulator-screenshots
          path: artifacts/android/*.png
          if-no-files-found: error
          retention-days: 30
