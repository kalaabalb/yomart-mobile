name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No previous commit is available; skipping changed-file format comparison."
            exit 0
          fi
          mapfile -t dart_files < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.dart')
          if (( ${#dart_files[@]} == 0 )); then
            echo "No Dart files changed."
          else
            dart format --output=none --set-exit-if-changed "${dart_files[@]}"
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android preview APKs against production API
        run: |
          flutter build apk --debug --split-per-abi --target-platform android-arm,android-arm64,android-x64 \
            --dart-define=MAIN_URL=https://yomart-api.onrender.com \
            --dart-define=PRIVACY_POLICY_URL=https://yomart.onrender.com/privacy-policy.html \
            --dart-define=YOMART_PREVIEW_CATALOG=true

      - name: Upload Android preview APKs
        uses: actions/upload-artifact@v4
        with:
          name: yomart-android-debug-apks
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            build/app/outputs/flutter-apk/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-emulator-screenshots:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Download x86_64 preview APK
        uses: actions/download-artifact@v4
        with:
          name: yomart-android-debug-apks
          path: artifacts/apk

      - name: Capture real Android emulator startup screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 240
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r artifacts/apk/app-x86_64-debug.apk
            adb shell monkey -p com.yomobiles.client 1
            mkdir -p artifacts/android
            sleep 4
            adb exec-out screencap -p > artifacts/android/android-app-startup.png
            sleep 8
            adb exec-out screencap -p > artifacts/android/android-app-login.png

      - name: Upload genuine Android emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yomart-android-emulator-screenshots
          path: artifacts/android/*.png
          if-no-files-found: ignore
          retention-days: 30
