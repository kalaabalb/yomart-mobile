name: Android signed release bundle

on:
  workflow_dispatch:
    inputs:
      preview_catalog:
        description: Keep preview-catalogue notice visible for closed testing
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release inputs
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PRIVACY_POLICY_URL: ${{ vars.YOMART_PRIVACY_POLICY_URL }}
          ACCOUNT_DELETION_URL: https://yomart.onrender.com/account-deletion.html
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS PRIVACY_POLICY_URL; do
            if [[ -z "${!value}" ]]; then
              echo "::error::Missing GitHub secret/variable: ${value}"
              exit 1
            fi
          done
          node -e 'const u=new URL(process.env.PRIVACY_POLICY_URL); if(u.protocol!=="https:" || u.username || u.password || u.search || u.hash || u.hostname.includes("placeholder") || u.hostname.includes("example")) process.exit(1)' || {
            echo "::error::YOMART_PRIVACY_POLICY_URL must be a final public HTTPS privacy policy URL."
            exit 1
          }
          curl --fail --silent --show-error "$PRIVACY_POLICY_URL" -o /tmp/yomart-privacy-policy.html
          curl --fail --silent --show-error "$ACCOUNT_DELETION_URL" -o /tmp/yomart-account-deletion.html
          if grep -Eiq 'REPLACE BEFORE PUBLICATION|<meta name="robots" content="noindex|Draft — not approved|Draft: the owner' /tmp/yomart-privacy-policy.html /tmp/yomart-account-deletion.html; then
            echo "::error::Privacy or account-deletion page is still a draft or marked noindex."
            exit 1
          fi
          grep -q 'YOMART_API_BASE_URL' <(curl --fail --silent --show-error https://yomart.onrender.com/account-deletion-config.js)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - name: Configure private Android signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          chmod 600 android/app/release-key.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=app/release-key.jks\n'
          } > android/key.properties
          chmod 600 android/key.properties
          keytool -list -keystore android/app/release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Install dependencies and verify source
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build signed production App Bundle
        env:
          PRIVACY_POLICY_URL: ${{ vars.YOMART_PRIVACY_POLICY_URL }}
          PREVIEW_CATALOG: ${{ inputs.preview_catalog }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --dart-define=MAIN_URL=https://yomart-api.onrender.com \
            --dart-define=PRIVACY_POLICY_URL="$PRIVACY_POLICY_URL" \
            --dart-define=YOMART_BUILD_ENV=production \
            --dart-define=YOMART_EXPECTED_API_ORIGIN=https://yomart-api.onrender.com \
            --dart-define=YOMART_NO_STAGING_API=true \
            --dart-define=YOMART_NO_STAGING_SITE=true \
            --dart-define=YOMART_PREVIEW_CATALOG="$PREVIEW_CATALOG"
          jarsigner -verify -certs build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab > build/app/outputs/bundle/release/signing-certificate.txt
          sha256sum build/app/outputs/bundle/release/app-release.aab > build/app/outputs/bundle/release/app-release.aab.sha256

      - name: Upload signed release bundle and certificate fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: yomart-signed-production-aab
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/signing-certificate.txt
            build/app/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove private signing material
        if: always()
        run: |
          rm -f android/key.properties android/app/release-key.jks
